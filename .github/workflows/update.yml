name: Update casks

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [infernode-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point casks at the latest release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(scripts/update.sh)" >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "InferNode ${{ steps.up.outputs.version }}"
          git push
